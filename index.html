<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Copa Rino</title>
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copa Rino">
<link rel="apple-touch-icon" href="escudos/aaamc.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0B0C0E;
  --surface:#131518;
  --line:#20232780;
  --line-solid:#202327;
  --text:#F2F4F6;
  --muted:#98A0A8;
  --faint:#636B73;
  --red:#E02B32;
  --red-soft:rgba(224,43,50,.10);
  --gold:#E0B03C;
  --laranja:#EE8B2D;
  --laranja-fraco:rgba(238,139,45,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* O host reserva as faixas de segurança (relógio em cima, indicador
   embaixo) como padding da página. Só que aí a altura útil vira
   "tela − faixas" e ainda sobra o padding: o resultado é um rodapé
   preto. Zeramos as duas e cada barra cuida da sua faixa. */
:root{padding-top:0;padding-bottom:0}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  /* a tela inteira é o app: só o miolo rola, nada de rolagem na página */
  overflow:hidden;
  /* altura dinâmica: acompanha a barra do navegador ao aparecer e sumir */
  height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:5px}
img{display:block}
.num{font-variant-numeric:tabular-nums}

.shell{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- topo ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;
}
.topbar .marca{width:26px;height:26px;border-radius:50%;flex:none}
.wordmark{font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1;margin:0}
.wordmark em{font-style:normal;color:var(--red)}
.topbar-spacer{flex:1}
.btn-turma{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--faint);
}
.btn-turma img{width:22px;height:22px;border-radius:50%}
.btn-turma:hover{color:var(--text)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 22px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}

/* ---------- abas ---------- */
/* A barra faz parte da coluna do app — não é flutuante. Assim ela
   encosta no fim da tela em qualquer aparelho, sem sobrar rodapé
   morto embaixo nem precisar de espaço reservado no conteúdo. */
.tabbar{
  flex:none;z-index:30;
  background:rgba(11,12,14,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-solid);
  padding-bottom:4px;
}
/* instalado na tela de início não há barra do navegador embaixo:
   aí sim a faixa do indicador precisa ser respeitada */
@media (display-mode:standalone),(display-mode:fullscreen){
  .tabbar{padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
}
.tabbar-inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{
  padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--faint);
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab .escudo-aba{width:19px;height:19px;border-radius:50%;opacity:.5}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"] .escudo-aba{opacity:1}

/* ---------- segmentado ---------- */
.segmento{display:flex;gap:22px;margin:4px 0 6px;border-bottom:1px solid var(--line-solid)}
.seg{
  padding:9px 0 10px;font-size:14px;font-weight:600;color:var(--faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.seg[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--red)}

.competicao{display:flex;align-items:center;gap:10px;padding:14px 0 2px}
.competicao h2{font-weight:700;font-size:16px;margin:0;letter-spacing:-.015em}
.seletor-ano{
  display:inline-flex;align-items:center;gap:5px;margin-left:auto;
  font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;
}
.seletor-ano .cx{font-size:9px;opacity:.7}
.seletor-ano:hover{color:var(--text)}

/* ---------- listas de jogos ---------- */
.dia{
  display:flex;align-items:center;gap:8px;margin:26px 0 2px;
  font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em;
}
.dia.passado{color:var(--faint);font-weight:600}
.marca-seguir{
  padding:2px 8px;border-radius:999px;background:var(--red-soft);
  color:var(--red);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.rodada{
  margin:16px 0 2px;font-size:11px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);
}
.lista{display:flex;flex-direction:column}
.jogo{
  display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:8px;
  padding:13px 0;width:100%;text-align:left;border-bottom:1px solid var(--line);
  cursor:pointer;
}
.lista .jogo:last-child{border-bottom:none}
.jogo:hover{background:rgba(255,255,255,.015)}
.lado{display:flex;align-items:center;gap:9px;min-width:0}
.lado.casa{justify-content:flex-end}
.lado img{width:27px;height:27px;border-radius:50%;flex:none}
.lado .nm{
  font-size:14px;font-weight:500;line-height:1.2;color:var(--muted);min-width:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.lado.casa .nm{text-align:right}
.jogo.fim .lado.venceu .nm{color:var(--text);font-weight:700}
.jogo:not(.fim) .lado .nm{color:var(--text);font-weight:500}
.centro{display:flex;flex-direction:column;align-items:center;gap:1px}
.centro .rot{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.centro .val{
  font-size:16.5px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.2;color:var(--muted);letter-spacing:-.01em;
}
.jogo.fim .centro .val{color:var(--text)}
.esc-link{cursor:pointer;border-radius:50%;display:block;flex:none}
.sem-escudo{
  width:27px;height:27px;border-radius:50%;flex:none;
  border:1px dashed var(--line-solid);
}
.sem-escudo.grande{width:58px;height:58px;border-width:2px}
.lado.indef .nm{color:var(--faint);font-weight:500;font-size:13px}
.jogo:not(.fim) .lado.indef .nm{color:var(--faint)}
.placar .eq.indef .nm{color:var(--faint);font-weight:500}

/* ---------- tela da partida ---------- */
.voltar{
  display:inline-flex;align-items:center;gap:7px;padding:14px 0 4px;
  font-size:13px;font-weight:600;color:var(--faint);
}
.voltar:hover{color:var(--text)}
.voltar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.placar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding:14px 0 20px}
.placar .eq{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.placar .eq img{width:58px;height:58px;border-radius:50%}
.placar .eq .nm{font-size:13.5px;font-weight:600;line-height:1.25;color:var(--text)}
.placar .eq .tn{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.05em;margin-top:2px}
.placar .meio{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:14px}
.placar .pl{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.placar .pl.pend{font-size:23px;color:var(--muted);font-weight:700}
.placar .et{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.ficha{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 0 4px}
.ficha span{
  border:1px solid var(--line-solid);border-radius:999px;padding:3px 11px;
  font-size:11.5px;font-weight:600;color:var(--faint);
}
.gol{
  display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.gol:last-child{border-bottom:none}
.gol .quem{min-width:0}
.gol .quem .a{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.gol .quem .b{font-size:12px;color:var(--faint);line-height:1.35}
.gol .quem.esq{text-align:right}
.gol .bola{width:20px;height:20px;justify-self:center;opacity:.85}
.gol .bola svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.5}

/* ---------- chaveamento ---------- */
.chave{display:flex;flex-direction:column;align-items:center;padding:20px 0 10px}
.chave-rot{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px;
}
.chave-rot.repesca{color:var(--laranja)}
.chave-rot.grande{color:var(--red);font-size:13px;letter-spacing:.16em}
.conector{width:1px;height:22px;background:var(--line-solid);margin:9px 0}
.cc{
  width:100%;max-width:236px;background:var(--surface);
  border:1px solid var(--line-solid);border-radius:10px;
  padding:11px 12px;text-align:center;cursor:pointer;
}
.cc:hover{border-color:var(--muted)}
.cc.repesca{border-color:rgba(238,139,45,.3)}
.cc.grande{max-width:100%;padding:18px 14px;border-color:rgba(224,43,50,.35);background:var(--red-soft)}
.cc-hora{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.cc-times{display:flex;align-items:flex-start;justify-content:center;gap:12px;margin:10px 0 9px}
.cc-eq{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px}
.cc-eq img{width:34px;height:34px;border-radius:50%}
.cc-eq .sem-escudo{width:34px;height:34px}
.cc.grande .cc-eq{width:104px}
.cc.grande .cc-eq img,.cc.grande .cc-eq .sem-escudo{width:54px;height:54px}
.cc-tn{font-size:10.5px;font-weight:600;color:var(--text);line-height:1.3}
.cc-eq.indef .cc-tn{color:var(--faint);font-weight:500}
.cc-meio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:9px;min-width:46px}
.cc.grande .cc-meio{padding-top:14px}
.cc-vs{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em}
.cc-placar{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.cc.grande .cc-placar{font-size:26px}
.cc-base{font-size:10.5px;color:var(--faint);font-weight:500;letter-spacing:.03em}
.trofeu{width:22px;height:25px;stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.cc.grande .trofeu{width:27px;height:31px}

/* ---------- classificação ---------- */
.grupo-cab{
  margin:24px 0 2px;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);
}
table.tabela{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tabela th{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:right;padding:8px 5px;
}
table.tabela th:first-child{text-align:left;padding-left:0}
table.tabela td{
  padding:10px 5px;border-top:1px solid var(--line);
  text-align:right;font-size:13.5px;color:var(--muted);font-weight:500;
}
table.tabela td:first-child{padding-left:0;text-align:left}
table.tabela td.pts{color:var(--text);font-weight:700}
table.tabela th:last-child,table.tabela td:last-child{padding-right:0}
.linha-time{display:flex;align-items:center;gap:10px;min-width:0}
.rule{width:2px;height:30px;border-radius:1px;background:transparent;flex:none}
.rule.direto{background:var(--red)}
.rule.repesca{background:var(--laranja)}
.pos{font-size:12px;font-weight:600;color:var(--faint);width:10px;text-align:center;flex:none}
.linha-time img{width:26px;height:26px;border-radius:50%;flex:none}
/* nome em cima, turma embaixo: os dois são <span>, então precisam de
   display:block — sem isso corriam na mesma linha e quebravam no meio */
.linha-time .txt{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.linha-time .nm{
  display:block;max-width:100%;
  font-size:14px;font-weight:600;color:var(--text);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.linha-time .sub{
  display:block;max-width:100%;
  font-size:11px;color:var(--faint);line-height:1.3;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
tr.fav td{background:rgba(224,176,60,.06)}
tr.fav .linha-time .nm{color:var(--gold)}

.legenda{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--faint)}
.legenda i{width:2px;height:11px;border-radius:1px;display:inline-block}
.legenda i.direto{background:var(--red)}
.legenda i.repesca{background:var(--laranja)}
.linha-time .sub b{font-weight:600}
.linha-time .sub b.direto{color:var(--red)}
.linha-time .sub b.repesca{color:var(--laranja)}

/* ---------- avisos e vazios ---------- */
.aviso{
  display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;padding:11px 0 0;
  border-top:1px solid var(--line-solid);font-size:12.5px;color:var(--faint);line-height:1.5;
}
.aviso b{color:var(--muted);font-weight:600}
.faixa-sim{
  display:flex;align-items:center;gap:9px;margin:14px 0 0;padding:10px 12px;
  background:var(--red-soft);border-radius:6px;font-size:12.5px;color:var(--muted);line-height:1.45;
}
.faixa-sim b{color:var(--red);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;flex:none}
.vazio{text-align:center;padding:52px 18px;color:var(--faint)}
.vazio .glyph{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line-solid);display:inline-block;
  padding:7px 14px;border-radius:999px;margin-bottom:16px;
}
.vazio p{margin:0 auto;max-width:30ch;font-size:14px;line-height:1.55}
.vazio p + p{margin-top:8px;font-size:13px}

/* ---------- meu time ---------- */
.hero{display:flex;align-items:center;gap:15px;padding:22px 0 20px}
.hero img{width:70px;height:70px;border-radius:50%;flex:none}
.hero h1{font-weight:800;font-size:22px;line-height:1.1;margin:0 0 5px;letter-spacing:-.025em;text-wrap:balance}
.hero .insta{
  display:inline-flex;align-items:center;gap:5px;margin:0 0 8px;
  font-size:12.5px;font-weight:500;color:var(--faint);text-decoration:none;
}
.hero .insta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.hero .insta:hover{color:var(--red)}
.bio{
  margin:0 0 4px;font-size:13.5px;line-height:1.5;color:var(--muted);
  max-width:46ch;text-wrap:pretty;
}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em}
.hero-meta span{border:1px solid var(--line-solid);border-radius:999px;padding:3px 9px;color:var(--faint)}
.hero-meta span.destaque{border-color:transparent;color:#0B0C0E}
.resumo{display:flex;border-top:1px solid var(--line-solid);border-bottom:1px solid var(--line-solid)}
.resumo div{flex:1;padding:13px 2px;text-align:center}
.resumo .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.resumo .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:5px;font-weight:600}
.sec{margin:26px 0 2px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex}
.sec .hint{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint);font-size:12px}
.trocar{
  display:block;width:100%;margin-top:30px;padding:13px;border:1px solid var(--line-solid);
  border-radius:8px;font-size:13px;font-weight:600;color:var(--faint);
}
.trocar:hover{color:var(--text);border-color:var(--muted)}

/* ---------- administração ---------- */
.adm-topo{
  display:flex;align-items:center;gap:10px;padding:16px 0 12px;
  border-bottom:1px solid var(--line-solid);margin-bottom:4px;
}
.adm-topo h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.02em}
.adm-topo .tag{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--laranja);border:1px solid rgba(238,139,45,.4);border-radius:999px;padding:2px 8px;
}
.adm-acao{
  margin-left:auto;font-size:13px;font-weight:600;color:var(--faint);
}
.adm-acao:hover{color:var(--text)}

.campo{display:block;margin:16px 0 0}
.campo label{
  display:block;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:6px;
}
.campo input,.campo select{
  width:100%;padding:11px 12px;font:inherit;font-size:15px;color:var(--text);
  background:var(--surface);border:1px solid var(--line-solid);border-radius:8px;
}
.campo input:focus,.campo select:focus{outline:2px solid var(--red);outline-offset:1px}
.campo .dica{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.45}
.campo .dica a{color:var(--muted)}

.btn{
  display:block;width:100%;margin-top:18px;padding:13px;border-radius:8px;
  font-size:14px;font-weight:700;letter-spacing:.02em;
  background:var(--red);color:#fff;border:1px solid var(--red);
}
.btn:disabled{opacity:.45}
.btn.secundario{background:none;color:var(--muted);border-color:var(--line-solid);font-weight:600}
.btn.secundario:hover{color:var(--text);border-color:var(--muted)}

.adm-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 2px;border-bottom:1px solid var(--line);
}
.adm-item .quem{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.adm-item .quando{font-size:11.5px;color:var(--faint);font-weight:500}
.adm-item .est{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;flex:none;
}
.adm-item .est.aberto{color:var(--faint);border:1px solid var(--line-solid)}
.adm-item .est.pronto{color:var(--red);background:var(--red-soft)}

.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.stepper button{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line-solid);
  font-size:20px;font-weight:700;line-height:1;color:var(--muted);
}
.stepper button:hover{color:var(--text);border-color:var(--muted)}
.stepper .n{
  font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
  min-width:40px;text-align:center;letter-spacing:-.03em;
}
.lado-edit{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0;text-align:center}

<script>
"use strict";

/* ============================================================
   COPA RINO
   ------------------------------------------------------------
   TIMES e HALL são fixos. As PARTIDAS vivem no banco
   compartilhado do artifact, coleção "partidas":

     {
       edicao: 2026,
       fase: "grupos" | "quartas" | "semi" | "final" | "terceiro",
       rodada: 1,                   // só na fase de grupos
       casa: "t15", fora: "t19",
       golsCasa: 2, golsFora: 1,    // só valem quando o jogo está encerrado
       status: "agendado" | "encerrado" | "wo",
       dataHora: "2026-09-27T09:00:00-03:00",
       local: "Quadra 1",
       gols: [                      // quem marcou — na ordem em que saíram
         {time:"t15", jogador:"Léo Martins", assistencia:"Caio Ferraz"},
         {time:"t15", jogador:"Vini Prado", contra:true}
       ]
     }

   Sobre "gols": "time" é o id do time que MARCOU o gol (em gol
   contra, o time que ficou com o ponto). "assistencia" e
   "contra" são opcionais. Se golsCasa/golsFora vierem vazios mas
   houver gols na lista, o placar é contado a partir dela.

   NÃO existe estado "ao vivo": acompanhar jogo em andamento
   exigiria alguém atualizando à beira da quadra. Um jogo ou está
   encerrado, com placar, ou está por vir, sem placar nenhum —
   mesmo que o placar já tenha sido preenchido por engano.

   Enquanto a coleção estiver vazia, o app roda uma SIMULAÇÃO da
   fase de grupos (turno único, todos contra todos dentro do
   grupo) só para mostrar como as telas ficam. A simulação some
   sozinha no instante em que o primeiro jogo real for gravado.
   ============================================================ */

const EDICAO_ATUAL = 2026;
/* Formato da Copa Rino 2026, confirmado pela organização:
   1º de cada grupo vai direto à semifinal; 2º e 3º passam pela
   repescagem; o 4º está eliminado. */
function destino(i){
  if (i === 0) return {txt:"Semifinal",  cls:"direto"};
  if (i <= 2)  return {txt:"Repescagem", cls:"repesca"};
  return null;
}

/* insta e bio vêm do perfil de cada turma no Instagram.
   As bios foram copiadas como estão, tirando só a lista de títulos —
   esses aparecem sozinhos em "Na história da copa". */
const TIMES = [
  {id:"t15", turma:"T15", nome:"Renal Madrid",         grupo:"A", cor:"#C9A227",
   insta:"renalmadridtxv",
   bio:"O maior time da medcesu — TXV. Todos querem ser T15."},

  {id:"t19", turma:"T19", nome:"Borússia Doctors",     grupo:"A", cor:"#FADF00",
   insta:"borussia.doctors",
   bio:"Time da T19."},

  {id:"t20", turma:"T20", nome:"MilanB FC",            grupo:"A", cor:"#E23B3B",
   insta:"milanbtxx",
   bio:"Fut TXX — MedCesu. A torcida pede: joguem como bebemos!"},

  {id:"t25", turma:"T25", nome:"Bayern Pneumunique",   grupo:"A", cor:"#DC0A2D",
   insta:"bayernpneumunique.txxv",
   bio:"Time da T25 — Medicina Cesu."},

  {id:"t18", turma:"T18", nome:"Botafofo FC",          grupo:"B", cor:"#F2C438",
   insta:"botafofo_t18",
   bio:""},

  {id:"t21", turma:"T21", nome:"Ozempic de Marseille", grupo:"B", cor:"#D4B169",
   insta:"ozempicdemarseille21",
   bio:"Perfil oficial de futebol da T21. Segue a gente e acompanha a maior seleção. Est. 2024."},

  {id:"t23", turma:"T23", nome:"Real Diabetis",        grupo:"B", cor:"#1E8449",
   insta:"realdiabetist23",
   bio:"Fut T23 — Medcesu."},

  {id:"t24", turma:"T24", nome:"Liverpulmonar",        grupo:"B", cor:"#C8102E",
   insta:"liverpulmonar.txxiv",
   bio:"Medicina Unicesumar T24"},
];

/* Elencos informados pelas turmas. Só entram aqui os times que
   mandaram a lista — os outros seguem com o campo livre, e no admin
   sempre existe a opção de digitar um nome que não está na lista. */
const ELENCO_FIXO = {
  /* T21 — elenco divulgado pela turma. Sem posição por enquanto:
     a ordem segue o cartaz (goleiro, zaga, meias, alas, ataque). */
  t21: [
    "Misturinha", "Rafael", "Henrique", "Sakuma", "Fedrizze", "Jotave",
    "Endryo", "Ryan", "Tonon", "Bazon", "Pep",
  ],
};

/* Reconstituído pelas bios das turmas no Instagram — não confirmado
   pela organização. null = a confirmar. */
const HALL = [
  {ano:2025, campeao:"t15", vice:null,  terceiro:"t21"},
  {ano:2024, campeao:"t15", vice:null,  terceiro:null},
  {ano:2023, campeao:"t18", vice:"t15", terceiro:null},
  {ano:2022, campeao:null,  vice:"t15", terceiro:null},
];

const timeDe = id => TIMES.find(t => t.id === id) || null;
const escudo = id => "escudos/" + id + ".png";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const chaveJogo = m => m.id || [m.edicao || EDICAO_ATUAL, m.fase, m.rodada || 0, m.casa, m.fora].join("-");

/* Só existem dois estados: encerrado ou por vir. Qualquer status que
   não seja encerrado/wo conta como jogo que ainda não aconteceu. */
const encerrado = m => m.status === "encerrado" || m.status === "wo";

/* Placar oficial: usa golsCasa/golsFora e, na falta deles, conta a
   lista de gols. Jogo não encerrado nunca mostra placar, mesmo que
   os gols já tenham sido preenchidos. */
function placar(m){
  if (!encerrado(m)) return [null, null];
  if (m.golsCasa != null && m.golsFora != null) return [Number(m.golsCasa), Number(m.golsFora)];
  if (Array.isArray(m.gols) && m.gols.length){
    return [m.gols.filter(g => g.time === m.casa).length, m.gols.filter(g => g.time === m.fora).length];
  }
  return [null, null];
}

/* ---------- simulação da fase de grupos ---------- */
/* A copa inteira acontece em um dia. Turno único: em cada grupo de 4,
   todos se enfrentam uma vez = 3 rodadas. Duas quadras em paralelo,
   jogos de 40 em 40 minutos. */
const NOMES_EXEMPLO = [
  "Léo Martins","Caio Ferraz","Pedro Bastos","Rafa Quirino","Dudu Carvalho","Vini Prado",
  "Gui Menezes","Bruno Tavares","Matheus Lins","Téo Andrade","João Peçanha","Arthur Nogueira",
  "Felipe Rangel","Otávio Brandão","Murilo Sampaio","Gabriel Ítalo",
];

function golsExemplo(casa, fora, gc, gf){
  const lista = [];
  const semente = hash(casa + fora);
  const add = (time, i, n) => {
    const h = hash(time + i + n);
    const jogador = NOMES_EXEMPLO[(semente + h) % NOMES_EXEMPLO.length];
    let assistencia = NOMES_EXEMPLO[(semente + h * 7 + 5) % NOMES_EXEMPLO.length];
    if (assistencia === jogador || h % 3 === 0) assistencia = null;
    lista.push({time, jogador, assistencia});
  };
  for (let i = 0; i < gc; i++) add(casa, i, "c");
  for (let i = 0; i < gf; i++) add(fora, i, "f");
  return lista;
}

function simulacao(){
  const conf = {
    A: [[["t15","t20"],["t19","t25"]], [["t15","t19"],["t20","t25"]], [["t15","t25"],["t19","t20"]]],
    B: [[["t18","t23"],["t21","t24"]], [["t18","t21"],["t23","t24"]], [["t18","t24"],["t21","t23"]]],
  };
  const agora = new Date();
  /* Tudo no mesmo dia: o primeiro jogo fica ~2h atrás, preso entre
     08:00 e 16:00, para a grade nunca atravessar a meia-noite. */
  const base = new Date(agora);
  base.setHours(Math.min(16, Math.max(8, agora.getHours() - 2)), 0, 0, 0);

  /* placar estável: derivado dos ids, não sorteado a cada render */
  const gols = (a, b) => { const h = hash(a + b); return [h % 5, (h >>> 7) % 4]; };

  const jogos = [];
  let slot = 0;
  for (let r = 0; r < 3; r++){
    for (let par = 0; par < 2; par++){
      const quando = new Date(base.getTime() + slot * 40 * 60000);
      ["A","B"].forEach((g, qi) => {
        const [casa, fora] = conf[g][r][par];
        const fim = new Date(quando.getTime() + 35 * 60000);
        const acabou = fim <= agora;
        const [gc, gf] = gols(casa, fora);
        jogos.push({
          exemplo:true, edicao:EDICAO_ATUAL, fase:"grupos", rodada:r+1,
          casa, fora,
          golsCasa: acabou ? gc : null,
          golsFora: acabou ? gf : null,
          gols: acabou ? golsExemplo(casa, fora, gc, gf) : [],
          status: acabou ? "encerrado" : "agendado",
          dataHora: quando.toISOString(),
          local: "Quadra " + (qi + 1),
        });
      });
      slot++;
    }
  }
  return jogos;
}

/* ---------- estado ---------- */
const CHAVE = "copa-rino-turma";
let favorita = null;
let reais = [];
let ELENCOS = {};   // nomes já usados por time, para virarem atalho no admin
let aba = "jogos";
let faseView = "grupos";
let anoView = EDICAO_ATUAL;
let telaTime = null;
let telaJogo = null;
let pilha = [];
let menuAberto = false;
let jaRolou = false;

/* administração (tela #admin, mais abaixo) — declarado aqui porque a
   escolha de turma, que vem antes, já consulta modoAdmin */
let modoAdmin = false;
let admJogo = null;      // id do jogo aberto para edição
let admAviso = null;     // {tipo, texto}
let admSalvando = false;

try { favorita = localStorage.getItem(CHAVE) || null; } catch (e) {}
if (favorita && !timeDe(favorita)) favorita = null;

const ehSimulacao = () => reais.length === 0;
const jogos = () => (ehSimulacao() ? simulacao() : reais);

function salvarFavorita(id){
  favorita = id;
  try { id ? localStorage.setItem(CHAVE, id) : localStorage.removeItem(CHAVE); } catch (e) {}
}

/* ---------- navegação ---------- */
function navegar(novo){
  pilha.push({aba, telaTime, telaJogo, faseView, anoView});
  aba = novo.aba != null ? novo.aba : aba;
  telaTime = novo.telaTime != null ? novo.telaTime : null;
  telaJogo = novo.telaJogo != null ? novo.telaJogo : null;
  document.getElementById("main").scrollTop = 0;
  jaRolou = true;
  render();
}
function voltar(){
  const p = pilha.pop();
  if (!p) return;
  aba = p.aba; telaTime = p.telaTime; telaJogo = p.telaJogo;
  faseView = p.faseView; anoView = p.anoView;
  document.getElementById("main").scrollTop = 0;
  jaRolou = true;
  render();
}
const btnVoltar = rotulo => pilha.length
  ? `<button class="voltar" id="btn-voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${esc(rotulo || "Voltar")}</button>`
  : "";

/* ---------- derivações ---------- */
function classificacao(grupo, lista){
  const linhas = TIMES.filter(t => t.grupo === grupo)
    .map(t => ({time:t, p:0, j:0, v:0, e:0, d:0, gp:0, gc:0}));
  const porId = Object.fromEntries(linhas.map(l => [l.time.id, l]));

  lista.filter(m => m.fase === "grupos" && encerrado(m))
    .forEach(m => {
      const c = porId[m.casa], f = porId[m.fora];
      if (!c || !f) return;
      const [pc, pf] = placar(m);
      const gc = Number(pc)||0, gf = Number(pf)||0;
      c.j++; f.j++; c.gp+=gc; c.gc+=gf; f.gp+=gf; f.gc+=gc;
      if (gc > gf){ c.v++; c.p+=3; f.d++; }
      else if (gc < gf){ f.v++; f.p+=3; c.d++; }
      else { c.e++; f.e++; c.p++; f.p++; }
    });

  /* Desempate: pontos, vitórias, saldo, gols pró. Revisar com o regulamento. */
  linhas.sort((a,b) => b.p - a.p || b.v - a.v || (b.gp-b.gc)-(a.gp-a.gc) || b.gp - a.gp
    || a.time.turma.localeCompare(b.time.turma));
  return linhas;
}

const ordenadas = lista => lista.slice().sort((a,b) =>
  String(a.dataHora || "9999").localeCompare(String(b.dataHora || "9999")));

const FASES_MATA = ["repescagem","semi","final"];
const faseNome = f => ({grupos:"Fase de grupos", repescagem:"Repescagem",
  semi:"Semifinal", final:"Final"}[f] || "");

function chaveDia(iso){
  if (!iso) return "sem-data";
  const d = new Date(iso);
  if (isNaN(d)) return "sem-data";
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function rotuloDia(chave){
  if (chave === "sem-data") return "Data a definir";
  /* os dois ao meio-dia: a diferença sai inteira e o horário de verão
     não desloca o resultado (meia-noite contra meio-dia arredondava
     0,5 para cima e o dia de hoje virava "Amanhã") */
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const d = new Date(chave + "T12:00:00");
  const dif = Math.round((d - hoje) / 86400000);
  if (dif === 0) return "Hoje";
  if (dif === 1) return "Amanhã";
  if (dif === -1) return "Ontem";
  const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`;
}

function hora(iso){
  if (!iso) return "--:--";
  const d = new Date(iso);
  if (isNaN(d)) return "--:--";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

const faixaSimulacao = () => ehSimulacao()
  ? `<div class="faixa-sim"><b>Simulação</b><span>A tabela oficial ainda não saiu. Estes jogos e placares são exemplo, para mostrar como a tela fica.</span></div>`
  : "";

/* ---------- componentes ---------- */
function linhaJogo(m){
  const c = timeDe(m.casa), f = timeDe(m.fora);
  const fim = encerrado(m);
  const [pc, pf] = placar(m);
  const temPlacar = pc != null && pf != null;

  const rot = fim ? `<span class="rot">Fim</span>`
    : `<span class="rot">${esc(m.local || "")}</span>`;
  const val = temPlacar ? `${pc} - ${pf}` : hora(m.dataHora);

  /* o escudo aqui NÃO é clicável: a linha inteira leva à partida,
     e um alvo menor dentro dela só gera toque sem intenção */
  const lado = (t, rotulo, pos, venceu) => {
    const img = t ? `<img src="${escudo(t.id)}" alt="" width="27" height="27">`
                  : `<span class="sem-escudo"></span>`;
    const nm = `<span class="nm">${esc(t ? t.nome : (rotulo || "A definir"))}</span>`;
    return `<span class="lado ${pos}${venceu ? " venceu" : ""}${t ? "" : " indef"}">
      ${pos === "casa" ? `${nm}${img}` : `${img}${nm}`}
    </span>`;
  };

  return `<div class="jogo ${fim ? "fim" : ""}" role="button" tabindex="0" data-jogo="${esc(chaveJogo(m))}">
    ${lado(c, m.casaRotulo, "casa", temPlacar && pc > pf)}
    <span class="centro">${rot}<span class="val">${val}</span></span>
    ${lado(f, m.foraRotulo, "fora", temPlacar && pf > pc)}
  </div>`;
}

/* ---------- tela: partida ---------- */
const ICONE_BOLA = `<span class="bola"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2l3.4 2.5-1.3 4h-4.2l-1.3-4z"/><path d="M12 3.1v4.1M19.6 9.3l-4 .4M17.3 18.1l-2.9-2.4M6.7 18.1l2.9-2.4M4.4 9.3l4 .4"/></svg></span>`;

function viewPartida(){
  const m = jogos().find(x => chaveJogo(x) === telaJogo);
  if (!m) return `<div class="vazio"><p>Esta partida não está mais na tabela.</p></div>`;
  const c = timeDe(m.casa), f = timeDe(m.fora);
  const fim = encerrado(m);
  const [pc, pf] = placar(m);
  const temPlacar = pc != null && pf != null;

  const eq = (t, rotulo) => t
    ? `<div class="eq">
        <img class="esc-link" data-time="${t.id}" src="${escudo(t.id)}" alt="Escudo do ${esc(t.nome)}" width="58" height="58">
        <div><div class="nm">${esc(t.nome)}</div><div class="tn">${esc(t.turma)}</div></div>
      </div>`
    : `<div class="eq indef">
        <span class="sem-escudo grande"></span>
        <div><div class="nm">${esc(rotulo || "A definir")}</div></div>
      </div>`;

  const etiqueta = fim ? `<span class="et">Encerrado</span>`
    : `<span class="et">${esc(rotuloDia(chaveDia(m.dataHora)))}</span>`;

  const ficha = [
    m.fase === "grupos" ? "Rodada " + (m.rodada || "?") : faseNome(m.fase),
    m.local || null,
    m.dataHora ? hora(m.dataHora) : null,
  ].filter(Boolean);

  const gols = Array.isArray(m.gols) ? m.gols : [];
  let listaGols;
  if (gols.length){
    listaGols = gols.map(g => {
      const doCasa = g.time === m.casa;
      const nome = esc(g.jogador || "Gol") + (g.contra ? " (contra)" : "");
      const quem = `<div class="quem ${doCasa ? "esq" : "dir"}">
          <div class="a">${nome}</div>
          ${g.assistencia ? `<div class="b">${esc(g.assistencia)}</div>` : ""}
        </div>`;
      return `<div class="gol">${doCasa ? quem : "<div></div>"}${ICONE_BOLA}${doCasa ? "<div></div>" : quem}</div>`;
    }).join("");
  } else if (temPlacar && (pc + pf) === 0){
    listaGols = `<div class="vazio" style="padding:26px 10px"><p>Jogo sem gols.</p></div>`;
  } else if (temPlacar){
    listaGols = `<div class="vazio" style="padding:26px 10px"><p>Os autores dos gols ainda não foram lançados.</p></div>`;
  } else if (!c || !f){
    listaGols = `<div class="vazio" style="padding:26px 10px"><p>O confronto depende da classificação.</p><p>Assim que os times forem definidos, eles aparecem aqui.</p></div>`;
  } else {
    listaGols = `<div class="vazio" style="padding:26px 10px"><p>A partida ainda não começou.</p><p>Os gols aparecem aqui assim que forem marcados.</p></div>`;
  }

  return `${btnVoltar("Voltar")}
    <div class="placar">
      ${eq(c, m.casaRotulo)}
      <div class="meio">
        <div class="pl ${temPlacar ? "" : "pend"}">${temPlacar ? `${pc} - ${pf}` : esc(hora(m.dataHora))}</div>
        ${etiqueta}
      </div>
      ${eq(f, m.foraRotulo)}
    </div>
    <div class="ficha">${ficha.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    ${faixaSimulacao()}
    <div class="sec">Gols</div>
    ${listaGols}`;
}

/* ---------- aba: jogos ---------- */
function viewJogos(){
  const lista = ordenadas(jogos()).filter(m => (m.edicao || EDICAO_ATUAL) === EDICAO_ATUAL);
  if (!lista.length){
    return `<div class="vazio">
      <span class="glyph">Tabela em definição</span>
      <p>A tabela de jogos da Copa Rino 2026 ainda não foi divulgada.</p>
      <p>Assim que sair, os jogos aparecem aqui por dia — e o próximo abre no topo da tela.</p>
    </div>`;
  }

  const iProximo = lista.findIndex(m => !encerrado(m));
  const dias = [];
  lista.forEach((m, i) => {
    const k = chaveDia(m.dataHora);
    let bloco = dias.find(d => d.k === k);
    if (!bloco){ bloco = {k, jogos:[], proximo:false}; dias.push(bloco); }
    bloco.jogos.push(m);
    if (i === iProximo) bloco.proximo = true;
  });

  const hoje0 = new Date(); hoje0.setHours(0,0,0,0);
  let html = faixaSimulacao();

  dias.forEach(d => {
    const passado = d.k !== "sem-data" && new Date(d.k + "T12:00:00") < hoje0;
    html += `<div class="dia${passado ? " passado" : ""}"${d.proximo ? ' id="ancora"' : ""}>
      ${esc(rotuloDia(d.k))}${d.proximo && iProximo > 0 ? `<span class="marca-seguir">a seguir</span>` : ""}</div>`;

    const porRodada = [];
    d.jogos.forEach(m => {
      const rot = m.fase === "grupos" ? "Rodada " + (m.rodada || "?") : faseNome(m.fase);
      let b = porRodada.find(x => x.rot === rot);
      if (!b){ b = {rot, jogos:[]}; porRodada.push(b); }
      b.jogos.push(m);
    });
    porRodada.forEach(b => {
      html += `<div class="rodada">${esc(b.rot)}</div><div class="lista">${b.jogos.map(linhaJogo).join("")}</div>`;
    });
  });

  if (iProximo === -1){
    html += `<div class="aviso"><span><b>Fase de grupos encerrada.</b> Todos os jogos já foram disputados.</span></div>`;
  }
  return html;
}

/* ---------- aba: classificação ---------- */
function viewClassificacao(){
  let html = `<div class="competicao">
      <h2>Copa Rino</h2>
      <button class="seletor-ano" id="btn-ano">${anoView} <span class="cx">▼</span></button>
    </div>`;

  if (anoView !== EDICAO_ATUAL) return html + viewEdicaoAntiga(anoView);

  html += `<div class="segmento">
      <button class="seg" data-fase="grupos" aria-pressed="${faseView === "grupos"}">Fase de grupos</button>
      <button class="seg" data-fase="mata" aria-pressed="${faseView === "mata"}">Mata-mata</button>
    </div>`;

  const lista = jogos();
  if (faseView === "mata") return html + viewMataMata(lista);

  html += faixaSimulacao();

  ["A","B"].forEach(g => {
    const linhas = classificacao(g, lista);
    html += `<div class="grupo-cab">Grupo ${g}</div>
      <table class="tabela"><thead><tr>
        <th>Time</th><th>J</th><th>Gols</th><th>+/−</th><th>P</th>
      </tr></thead><tbody>`;
    linhas.forEach((l, i) => {
      const fav = l.time.id === favorita;
      const d = destino(i);
      html += `<tr class="${fav ? "fav" : ""}">
        <td>
          <button class="ir-time" data-id="${l.time.id}" style="all:unset;cursor:pointer;display:block">
            <span class="linha-time">
              <span class="rule ${d ? d.cls : ""}"></span>
              <span class="pos">${i+1}</span>
              <img src="${escudo(l.time.id)}" alt="" width="26" height="26">
              <span class="txt">
                <span class="nm">${esc(l.time.nome)}</span>
                <span class="sub">${esc(l.time.turma)}${d ? ` · <b class="${d.cls}">${d.txt}</b>` : ""}</span>
              </span>
            </span>
          </button>
        </td>
        <td>${l.j}</td><td>${l.gp}:${l.gc}</td>
        <td>${l.gp-l.gc > 0 ? "+" : ""}${l.gp-l.gc}</td>
        <td class="pts">${l.p}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });

  html += `<div class="legenda"><i class="direto"></i> Vai direto à semifinal <i class="repesca" style="margin-left:10px"></i> Passa pela repescagem</div>
    <div class="aviso"><span>Desempate por pontos, vitórias, saldo de gols e gols pró. O 4º de cada grupo está eliminado.</span></div>`;
  return html;
}

/* Chave em árvore: os confrontos mais distantes nas pontas e a final no
   meio, que é como se lê um mata-mata de olho. A ordem vertical segue o
   caminho real — Repescagem 1 alimenta a Semifinal 1, e assim por diante. */

const TROFEU = `<svg class="trofeu" viewBox="0 0 24 28" aria-hidden="true">
  <path d="M7 2h10v7a5 5 0 0 1-10 0z"/>
  <path d="M7 4H4v2a4 4 0 0 0 3 3.8M17 4h3v2a4 4 0 0 1-3 3.8"/>
  <path d="M12 14v5M8.5 22h7l1 4h-9z"/>
</svg>`;

/* "2º do Grupo B" não cabe num cartão de 78px: encurta para "2º Gr. B" */
const criterioCurto = t => !t ? "A definir" : t
  .replace("do Grupo", "Gr.")
  .replace("Vencedor da", "Venc.")
  .replace("Repescagem", "Rep.")
  .replace("Semifinal", "Semi");

function cartaoChave(m, grande){
  const c = timeDe(m.casa), f = timeDe(m.fora);
  const fim = encerrado(m);
  const [pc, pf] = placar(m);
  const tem = pc != null && pf != null;

  const eq = (t, rotulo) => t
    ? `<span class="cc-eq"><img src="${escudo(t.id)}" alt="" width="34" height="34">
        <span class="cc-tn">${esc(t.turma)}</span></span>`
    : `<span class="cc-eq indef"><span class="sem-escudo"></span>
        <span class="cc-tn">${esc(criterioCurto(rotulo))}</span></span>`;

  const meio = tem
    ? `<span class="cc-placar">${pc} - ${pf}</span>`
    : (grande ? TROFEU : `<span class="cc-vs">×</span>`);

  return `<div class="cc${grande ? " grande" : ""}${m.fase === "repescagem" ? " repesca" : ""}"
       role="button" tabindex="0" data-jogo="${esc(chaveJogo(m))}">
    <div class="cc-hora">${fim ? "Encerrado" : esc(hora(m.dataHora))}</div>
    <div class="cc-times">
      ${eq(c, m.casaRotulo)}
      <span class="cc-meio">${meio}</span>
      ${eq(f, m.foraRotulo)}
    </div>
    <div class="cc-base">${esc(m.local || "")}</div>
  </div>`;
}

function viewMataMata(lista){
  const daFase = f => ordenadas(lista).filter(m => m.fase === f);
  const reps = daFase("repescagem"), semis = daFase("semi"), finais = daFase("final");

  if (!reps.length && !semis.length && !finais.length){
    return `<div class="vazio">
      <span class="glyph">Ainda não definido</span>
      <p>O mata-mata começa quando a fase de grupos terminar.</p>
      <p>1º de cada grupo vai direto à semifinal; 2º e 3º passam pela repescagem.</p>
    </div>`;
  }

  /* de cima para baixo: ponta, semi, final, semi, ponta */
  const degraus = [
    reps[0]   && {rot:"Repescagem 1", m:reps[0],   cls:"repesca"},
    semis[0]  && {rot:"Semifinal 1",  m:semis[0]},
    finais[0] && {rot:"Final",        m:finais[0], cls:"grande", grande:true},
    semis[1]  && {rot:"Semifinal 2",  m:semis[1]},
    reps[1]   && {rot:"Repescagem 2", m:reps[1],   cls:"repesca"},
  ].filter(Boolean);

  return `<div class="chave">` + degraus.map((d, i) =>
    `${i ? `<div class="conector"></div>` : ""}
     <div class="chave-rot ${d.cls || ""}">${esc(d.rot)}</div>
     ${cartaoChave(d.m, d.grande)}`
  ).join("") + `</div>`;
}

function viewEdicaoAntiga(ano){
  const h = HALL.find(x => x.ano === ano);
  if (!h) return `<div class="vazio"><p>Sem registro desta edição.</p></div>`;
  const linha = (id, rot, cls) => {
    const t = timeDe(id);
    return `<div class="podio">
      <span class="rot ${cls}">${rot}</span>
      ${t ? `<img class="esc-link" data-time="${t.id}" src="${escudo(id)}" alt="Escudo do ${esc(t.nome)}" width="32" height="32"><span class="nm">${esc(t.nome)}</span>`
          : `<span class="na">a confirmar</span>`}
    </div>`;
  };
  return `<div style="height:14px"></div>
    ${linha(h.campeao, "Campeão", "ouro")}
    ${linha(h.vice, "Vice", "")}
    ${h.terceiro ? linha(h.terceiro, "3º lugar", "") : ""}
    <div class="aviso"><span><b>Ainda não é oficial.</b> Reconstituído pelas bios das turmas no Instagram — falta a confirmação da organização.</span></div>`;
}

/* ---------- aba: meu time ---------- */
function viewMeuTime(){
  const id = telaTime || favorita;
  if (!id){
    return `<div class="vazio" style="padding:40px 18px 30px">
        <span class="glyph">Nenhuma turma escolhida</span>
        <p>Escolha a sua turma para ver aqui os jogos dela e a posição no grupo.</p>
      </div>
      <div class="grade" id="grade-inline">${TIMES.map(t =>
        `<button class="escolha" data-id="${t.id}">
          <img src="${escudo(t.id)}" alt="Escudo do ${esc(t.nome)}">
          <span class="tn">${esc(t.turma)}</span>
        </button>`).join("")}</div>`;
  }

  const lista = jogos();
  const t = timeDe(id);
  const linhas = classificacao(t.grupo, lista);
  const pos = linhas.findIndex(l => l.time.id === id);
  const l = linhas[pos];
  const meus = ordenadas(lista).filter(m => m.casa === id || m.fora === id);
  const proximos = meus.filter(m => !encerrado(m));
  const passados = meus.filter(encerrado).reverse();
  const ehFav = favorita === id;

  const conquistas = [];
  HALL.forEach(h => {
    if (h.campeao === id) conquistas.push("Campeão " + h.ano);
    if (h.vice === id) conquistas.push("Vice " + h.ano);
    if (h.terceiro === id) conquistas.push("3º em " + h.ano);
  });

  return `${btnVoltar("Voltar")}
    <div class="hero">
      <img src="${escudo(id)}" alt="Escudo do ${esc(t.nome)}" width="70" height="70">
      <div style="min-width:0">
        <h1>${esc(t.nome)}</h1>
        ${t.insta ? `<a class="insta" href="https://instagram.com/${esc(t.insta)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
          @${esc(t.insta)}</a>` : ""}
        <div class="hero-meta">
          <span>${esc(t.turma)}</span><span>Grupo ${t.grupo}</span>
          ${ehFav ? `<span class="destaque" style="background:${t.cor}">Minha turma</span>` : ""}
        </div>
      </div>
    </div>

    ${t.bio ? `<p class="bio">${esc(t.bio)}</p>` : ""}

    ${faixaSimulacao()}

    <div class="sec">Fase de grupos<span class="hint">${l.j ? (pos+1) + "º no grupo " + t.grupo : "ainda sem jogos"}</span></div>
    <div class="resumo">
      <div><div class="v">${l.p}</div><div class="k">Pts</div></div>
      <div><div class="v">${l.j}</div><div class="k">J</div></div>
      <div><div class="v">${l.v}</div><div class="k">V</div></div>
      <div><div class="v">${l.e}</div><div class="k">E</div></div>
      <div><div class="v">${l.d}</div><div class="k">D</div></div>
      <div><div class="v">${l.gp-l.gc > 0 ? "+" : ""}${l.gp-l.gc}</div><div class="k">SG</div></div>
    </div>

    <div class="sec">Próximos jogos</div>
    ${proximos.length ? `<div class="lista">${proximos.map(linhaJogo).join("")}</div>`
      : `<div class="vazio" style="padding:26px 10px"><p>Nenhum jogo agendado.</p></div>`}

    <div class="sec">Resultados</div>
    ${passados.length ? `<div class="lista">${passados.map(linhaJogo).join("")}</div>`
      : `<div class="vazio" style="padding:26px 10px"><p>A turma ainda não entrou em campo nesta edição.</p></div>`}

    ${conquistas.length ? `<div class="sec">Na história da copa</div>
      <div class="hero-meta" style="gap:7px;margin-top:10px">${conquistas.map(c =>
        `<span style="border:1px solid var(--line-solid);border-radius:999px;padding:4px 10px;color:var(--gold);font-size:11.5px;font-weight:600">${c}</span>`).join("")}</div>` : ""}

    <button class="trocar" id="btn-trocar">Trocar de turma</button>`;
}

/* ---------- render ---------- */
function render(){
  const main = document.getElementById("main");
  document.getElementById("tabbar").hidden = modoAdmin;
  if (modoAdmin){
    document.getElementById("onboarding").hidden = true;
    main.innerHTML = viewAdmin();
    return;
  }
  if (telaJogo) main.innerHTML = viewPartida();
  else if (aba === "jogos") main.innerHTML = viewJogos();
  else if (aba === "classificacao") main.innerHTML = viewClassificacao();
  else main.innerHTML = viewMeuTime();

  document.querySelectorAll("#tabbar .tab").forEach(b =>
    b.setAttribute("aria-selected", String(!telaJogo && b.dataset.aba === aba)));

  const t = favorita ? timeDe(favorita) : null;
  const abaTime = document.getElementById("tab-meutime");
  abaTime.innerHTML = t
    ? `<img class="escudo-aba" src="${escudo(t.id)}" alt="" width="19" height="19">${esc(t.turma)}`
    : `<svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M12 4.2 18.5 7v5.2c0 3.6-2.6 6.3-6.5 7.6-3.9-1.3-6.5-4-6.5-7.6V7z"/></svg>Meu time`;

  const btn = document.getElementById("btn-turma");
  btn.hidden = !!t;
  if (!t) btn.textContent = "Escolher turma";

  if (aba === "jogos" && !telaJogo && !jaRolou){
    const alvo = document.getElementById("ancora");
    if (alvo){ jaRolou = true; main.scrollTop = Math.max(0, alvo.offsetTop - 10); }
  }
}

/* ---------- eventos ---------- */
document.getElementById("tabbar").addEventListener("click", ev => {
  const b = ev.target.closest(".tab");
  if (!b) return;
  aba = b.dataset.aba; telaTime = null; telaJogo = null; pilha = []; fecharMenu();
  document.getElementById("main").scrollTop = 0;
  jaRolou = aba !== "jogos";
  render();
});

document.getElementById("main").addEventListener("click", ev => {
  if (ev.target.closest("#btn-voltar")){ voltar(); return; }

  /* escudo tem prioridade sobre a linha do jogo */
  const escudoAlvo = ev.target.closest(".esc-link");
  if (escudoAlvo){
    ev.stopPropagation();
    navegar({aba:"meutime", telaTime:escudoAlvo.dataset.time});
    return;
  }

  const seg = ev.target.closest(".seg");
  if (seg){ faseView = seg.dataset.fase; render(); return; }

  const linha = ev.target.closest(".jogo, .cc");
  if (linha){ navegar({telaJogo: linha.dataset.jogo}); return; }

  const irTime = ev.target.closest(".ir-time");
  if (irTime){ navegar({aba:"meutime", telaTime:irTime.dataset.id}); return; }

  const escolha = ev.target.closest("#grade-inline .escolha");
  if (escolha){ salvarFavorita(escolha.dataset.id); telaTime = null; render(); return; }

  if (ev.target.closest("#btn-trocar")){ document.getElementById("onboarding").hidden = false; return; }
  if (ev.target.closest("#btn-ano")){ toggleMenu(ev.target.closest("#btn-ano")); return; }
});

/* teclado: a linha do jogo é um botão */
document.getElementById("main").addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const linha = ev.target.closest(".jogo, .cc");
  if (!linha) return;
  ev.preventDefault();
  navegar({telaJogo: linha.dataset.jogo});
});

document.getElementById("btn-turma").addEventListener("click", () => {
  document.getElementById("onboarding").hidden = false;
});

/* ---------- menu de anos ---------- */
function fecharMenu(){
  const m = document.getElementById("menu-anos");
  if (m) m.remove();
  menuAberto = false;
}
function toggleMenu(btn){
  if (menuAberto){ fecharMenu(); return; }
  const anos = [EDICAO_ATUAL, ...HALL.map(h => h.ano)];
  const el = document.createElement("div");
  el.className = "menu-anos"; el.id = "menu-anos";
  el.style.top = (btn.offsetTop + btn.offsetHeight + 6) + "px";
  el.innerHTML = anos.map(a => `<button data-ano="${a}" aria-current="${a === anoView}">${a}</button>`).join("");
  el.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    anoView = Number(b.dataset.ano);
    fecharMenu(); render();
  });
  document.getElementById("main").appendChild(el);
  menuAberto = true;
}

/* ---------- escolha de turma ---------- */
const overlay = document.getElementById("onboarding");
document.getElementById("grade-escolha").innerHTML = TIMES.map(t =>
  `<button class="escolha" data-id="${t.id}">
    <img src="${escudo(t.id)}" alt="Escudo do ${esc(t.nome)}">
    <span class="tn">${esc(t.turma)}</span>
  </button>`).join("");
document.getElementById("grade-escolha").addEventListener("click", ev => {
  const b = ev.target.closest(".escolha");
  if (!b) return;
  salvarFavorita(b.dataset.id);
  telaTime = null; overlay.hidden = true; render();
});
document.getElementById("btn-pular").addEventListener("click", () => { overlay.hidden = true; render(); });
if (!favorita && !modoAdmin) overlay.hidden = false;

/* ============================================================
   ADMINISTRAÇÃO — abre em #admin, não aparece em nenhum menu
   ------------------------------------------------------------
   Grava direto no dados.json do repositório, pela API do GitHub.
   O token fica só no navegador de quem administra (localStorage),
   nunca no código publicado. Qualquer pessoa consegue abrir esta
   tela; sem token, ninguém consegue salvar nada — a trava é o
   token, não o endereço.

   Para trocar por Firebase depois, o que muda é só gravarRemoto().
   ============================================================ */

const CHAVE_GH = "copa-rino-gh";

function ghConfig(){
  try { return JSON.parse(localStorage.getItem(CHAVE_GH) || "null") || {}; }
  catch (e) { return {}; }
}
function ghGuardar(cfg){
  try { localStorage.setItem(CHAVE_GH, JSON.stringify(cfg)); } catch (e) {}
}
function ghEsquecer(){
  try { localStorage.removeItem(CHAVE_GH); } catch (e) {}
}

/* o próprio endereço já diz o repositório quando está no GitHub Pages */
function repoDoEndereco(){
  const h = location.hostname, partes = location.pathname.split("/").filter(Boolean);
  if (h.endsWith(".github.io")) return {owner: h.split(".")[0], repo: partes[0] || ""};
  return {owner: "", repo: ""};
}

const paraB64 = txt => {
  const bytes = new TextEncoder().encode(txt);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
};
const deB64 = b64 => new TextDecoder().decode(
  Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function ghArquivo(){
  const {owner, repo, token} = ghConfig();
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/dados.json`, {
    headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"},
    cache: "no-store",
  });
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403
    ? "Token recusado pelo GitHub. Confira se ele tem permissão de escrita neste repositório."
    : r.status === 404 ? "Repositório ou arquivo dados.json não encontrado."
    : "GitHub respondeu " + r.status);
  const j = await r.json();
  return {doc: JSON.parse(deB64(j.content)), sha: j.sha};
}

async function gravarRemoto(doc, sha, mensagem){
  const {owner, repo, token} = ghConfig();
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/dados.json`, {
    method: "PUT",
    headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json",
              "Content-Type": "application/json"},
    body: JSON.stringify({
      message: mensagem,
      content: paraB64(JSON.stringify(doc, null, 2) + "\n"),
      sha,
    }),
  });
  if (!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error(r.status === 409
      ? "O arquivo mudou no GitHub enquanto você editava. Abra a tela de novo e refaça este lançamento."
      : "Não consegui salvar (GitHub " + r.status + "). " + t.slice(0, 120));
  }
}

    <label class="campo"><span>Usuário ou organização</span>

    <label class="campo"><span>Repositório</span>

    <label class="campo"><span>Token</span>
      <input id="adm-token" type="password" value="" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
      <span class="dica">No GitHub: Settings → Developer settings → Personal access tokens → Fine-grained. Dê acesso só a este repositório, com <b>Contents: Read and write</b>. Guarde o token em algum lugar — o GitHub só mostra uma vez.</span></label>
    <button class="btn" id="adm-entrar">Salvar acesso</button>

const cabecalhoAdmin = (titulo) => `<div class="adm-topo">
    <h1>${esc(titulo)}</h1><span class="tag">Admin</span>
    <button class="adm-acao" id="adm-fechar">Sair</button>
  </div>`;

/* ---------- lista de jogos ---------- */
function viewAdminLista(){
  const lista = ordenadas(jogos());
  let html = cabecalhoAdmin("Lançar resultados");
  if (admAviso) html += `<div class="aviso-adm ${admAviso.tipo}">${admAviso.texto}</div>`;

  let faseAtual = null;
  lista.forEach(m => {
    const rot = m.fase === "grupos" ? "Rodada " + (m.rodada || "?") : faseNome(m.fase);
    if (rot !== faseAtual){ faseAtual = rot; html += `<div class="rodada">${esc(rot)}</div>`; }
    const c = timeDe(m.casa), f = timeDe(m.fora);
    const [pc, pf] = placar(m);
    const nome = t => t ? t.turma : "?";
    html += `<button class="adm-item" data-adm-jogo="${esc(chaveJogo(m))}">
      <span class="quem">${nome(c)} × ${nome(f)}
        <span class="quando" style="display:block">${esc(hora(m.dataHora))} · ${esc(m.local || "")}</span></span>
      <span class="est ${encerrado(m) ? "pronto" : "aberto"}">${
        encerrado(m) ? `${pc}-${pf}` : "a jogar"}</span>
    </button>`;
  });
  html += `<button class="btn secundario" id="adm-config">Trocar o acesso do GitHub</button>`;
  return html;
}

/* ---------- edição de um jogo ---------- */
function viewAdminJogo(){
  const m = jogos().find(x => chaveJogo(x) === admJogo);
  if (!m) return viewAdminLista();
  const c = timeDe(m.casa), f = timeDe(m.fora);
  const gols = Array.isArray(m.gols) ? m.gols : [];
  const gc = Number(m.golsCasa) || 0, gf = Number(m.golsFora) || 0;
  const fim = encerrado(m);

  const seletor = (lado, atual, rotulo) => `
    <label class="campo" style="margin-top:0"><span>${esc(rotulo || "Time")}</span>
      <select data-adm-time="${lado}">
        <option value="">— escolher —</option>
        ${TIMES.map(t => `<option value="${t.id}" ${t.id === atual ? "selected" : ""}>${esc(t.turma)} · ${esc(t.nome)}</option>`).join("")}
      </select></label>`;

  const ladoEdit = (t, lado, rotulo, n) => t
    ? `<div class="lado-edit">
        <img src="${escudo(t.id)}" alt="" width="46" height="46">
        <div class="nm">${esc(t.nome)}</div>
        <div class="stepper">
          <button data-adm-gol="-${lado}" aria-label="Tirar um gol">−</button>
          <span class="n">${n}</span>
          <button data-adm-gol="+${lado}" aria-label="Somar um gol">+</button>
        </div>
      </div>`
    : `<div class="lado-edit" style="align-self:stretch">${seletor(lado, null, rotulo)}</div>`;

  /* lista do time: primeiro o elenco informado pela turma, depois
     os nomes que já apareceram em gols lançados (sem repetir) */
  const nomesDoTime = id => {
    const fixo = ELENCO_FIXO[id] || [];
    const usados = (ELENCOS[id] || []).filter(n => !fixo.includes(n));
    return fixo.concat(usados);
  };

  let html = cabecalhoAdmin(m.fase === "grupos" ? "Rodada " + m.rodada : faseNome(m.fase));
  html += `<button class="voltar" id="adm-voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Todos os jogos</button>
    <div style="display:flex;align-items:flex-start;gap:14px;padding:16px 0 4px">
      ${ladoEdit(c, "casa", criterioCurto(m.casaRotulo), gc)}
      ${ladoEdit(f, "fora", criterioCurto(m.foraRotulo), gf)}
    </div>`;

  if (c && f){
    html += `<p class="campo dica" style="margin-top:12px;text-align:center">
        O placar entra no app assim que você mexer no + ou no − — ou lançar um gol abaixo.${
        fim ? " Este jogo já está publicado como encerrado." : ""}
      </p>

      <div class="rodada" style="margin-top:22px">Gols</div>
      ${gols.length ? gols.map((g, i) => {
        const t = timeDe(g.time);
        return `<div class="gol-linha">
          ${t ? `<img src="${escudo(t.id)}" alt="" width="22" height="22">` : ""}
          <span class="txt"><span class="a">${esc(g.jogador || "Sem autor")}</span>
            ${g.assistencia ? `<span class="b">assistência de ${esc(g.assistencia)}</span>` : ""}</span>
          <button class="tirar" data-adm-tirar="${i}" aria-label="Remover gol">×</button>
        </div>`;
      }).join("") : `<p class="campo dica" style="margin-top:8px">Nenhum gol lançado. Se não quiser registrar quem marcou, basta usar os botões de + e − no placar.</p>`}

      ${[["casa", c], ["fora", f]].map(([lado, t]) => {
        const nomes = nomesDoTime(t.id);
        /* com elenco: lista suspensa, e "Outro" abre o campo de digitar —
           jogador não cadastrado nunca fica de fora.
           sem elenco: campo livre, como antes. */
        const entrada = nomes.length
          ? `<select id="adm-sel-${lado}" data-adm-sel="${lado}">
               <option value="">— quem marcou —</option>
               ${nomes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}
               <option value="__outro__">Outro — digitar o nome</option>
             </select>
             <input id="adm-nome-${lado}" placeholder="Nome do jogador"
                    style="margin-top:8px" autocapitalize="words" hidden>`
          : `<input id="adm-nome-${lado}" placeholder="Quem marcou" autocapitalize="words">`;
        return `<div class="campo">
          <label>Gol do ${esc(t.nome)}</label>
          ${entrada}
          <button class="btn secundario" data-adm-add="${lado}" style="margin-top:10px">Adicionar gol</button>
        </div>`;
      }).join("")}

      ${gols.length > gc + gf ? `<div class="aviso-adm">Há mais gols lançados do que o placar indica. O placar manda: confira os números acima.</div>` : ""}

      <button class="btn" id="adm-salvar" ${admSalvando ? "disabled" : ""}>${admSalvando ? "Salvando…" : "Salvar no app"}</button>`;
  } else {
    html += `<div class="aviso-adm">Escolha os dois times deste confronto para poder lançar o placar.</div>
      <button class="btn" id="adm-salvar" ${admSalvando ? "disabled" : ""}>${admSalvando ? "Salvando…" : "Salvar times"}</button>`;
  }

  if (admAviso) html += `<div class="aviso-adm ${admAviso.tipo}">${admAviso.texto}</div>`;
  return html;
}

function viewAdmin(){
  const cfg = ghConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) return viewAdminAcesso();
  return admJogo ? viewAdminJogo() : viewAdminLista();
}

/* ---------- salvar ---------- */
async function admSalvar(){
  const m = jogos().find(x => chaveJogo(x) === admJogo);
  if (!m || admSalvando) return;
  admSalvando = true; admAviso = null; render();
  try {
    const {doc, sha} = await ghArquivo();
    const alvo = (doc.partidas || []).find(p => (p.id || chaveJogo(p)) === admJogo);
    if (!alvo) throw new Error("Esta partida não está no dados.json do repositório.");

    alvo.casa = m.casa; alvo.fora = m.fora;
    alvo.status = m.status;
    alvo.golsCasa = m.golsCasa; alvo.golsFora = m.golsFora;
    alvo.gols = Array.isArray(m.gols) ? m.gols : [];

    /* guarda os nomes já usados para virarem atalho da próxima vez */
    doc.elencos = doc.elencos || {};
    alvo.gols.forEach(g => {
      if (!g.time || !g.jogador) return;
      const lista = doc.elencos[g.time] = doc.elencos[g.time] || [];
      if (!lista.includes(g.jogador)) lista.push(g.jogador);
    });
    doc.atualizadoEm = new Date().toISOString();

    const c = timeDe(alvo.casa), f = timeDe(alvo.fora);
    await gravarRemoto(doc, sha,
      `Resultado: ${c ? c.turma : "?"} ${alvo.golsCasa ?? "-"} x ${alvo.golsFora ?? "-"} ${f ? f.turma : "?"}`);

    ELENCOS = doc.elencos;
    admAviso = {tipo:"ok", texto:"<b>Salvo.</b> O GitHub republica em cerca de um minuto e o app de todo mundo se atualiza sozinho."};
    admJogo = null;
  } catch (e){
    admAviso = {tipo:"erro", texto: esc(e.message || "Não consegui salvar.")};
  }
  admSalvando = false;
  render();
}

/* ---------- eventos da administração ---------- */
function ligarAdmin(){
  const main = document.getElementById("main");

  main.addEventListener("click", ev => {
    if (!modoAdmin) return;

    if (ev.target.closest("#adm-fechar")){ location.hash = ""; return; }
    if (ev.target.closest("#adm-voltar")){ admJogo = null; admAviso = null; render(); return; }
    if (ev.target.closest("#adm-config")){ admJogo = null; admAviso = null; ghGuardar({...ghConfig(), token:""}); render(); return; }
    if (ev.target.closest("#adm-sair")){ ghEsquecer(); admAviso = {tipo:"ok", texto:"Token apagado deste aparelho."}; render(); return; }

    if (ev.target.closest("#adm-entrar")){
      const owner = document.getElementById("adm-owner").value.trim();
      const repo  = document.getElementById("adm-repo").value.trim();
      const token = document.getElementById("adm-token").value.trim();
      if (!owner || !repo || !token){ admAviso = {tipo:"erro", texto:"Preencha os três campos."}; render(); return; }
      ghGuardar({owner, repo, token});
      admAviso = null; render();
      return;
    }

    const abrir = ev.target.closest("[data-adm-jogo]");
    if (abrir){ admJogo = abrir.dataset.admJogo; admAviso = null;
      main.scrollTop = 0; render(); return; }

    const m = jogos().find(x => chaveJogo(x) === admJogo);
    if (!m) return;
    /* a partir da primeira edição os dois lados são números: um lado nulo
       faria o app cair na contagem dos gols e mostrar placar diferente */
    const numerar = () => {
      if (m.golsCasa == null) m.golsCasa = 0;
      if (m.golsFora == null) m.golsFora = 0;
    };

    const passo = ev.target.closest("[data-adm-gol]");
    if (passo){
      numerar();
      const [sinal, lado] = [passo.dataset.admGol[0], passo.dataset.admGol.slice(1)];
      const campo = lado === "casa" ? "golsCasa" : "golsFora";
      const atual = Number(m[campo]) || 0;
      m[campo] = Math.max(0, atual + (sinal === "+" ? 1 : -1));
      if (sinal === "-"){
        const idTime = lado === "casa" ? m.casa : m.fora;
        const i = (m.gols || []).map(g => g.time).lastIndexOf(idTime);
        if (i >= 0 && (m.gols.filter(g => g.time === idTime).length > m[campo])) m.gols.splice(i, 1);
      }
      if (m.golsCasa != null && m.golsFora != null && m.status !== "encerrado") m.status = "encerrado";
      render(); return;
    }

    const add = ev.target.closest("[data-adm-add]");
    if (add){
      const lado = add.dataset.admAdd;
      const sel = document.getElementById("adm-sel-" + lado);
      const campo = document.getElementById("adm-nome-" + lado);
      /* nome escolhido na lista; em "Outro", o que foi digitado */
      const daLista = sel && sel.value && sel.value !== "__outro__" ? sel.value : "";
      const nome = daLista || (campo && campo.value || "").trim();
      if (!nome){ (sel && !sel.value ? sel : campo).focus(); return; }
      numerar();
      m.gols = Array.isArray(m.gols) ? m.gols : [];
      m.gols.push({time: lado === "casa" ? m.casa : m.fora, jogador: nome});
      if (campo) campo.value = "";
      const alvo = lado === "casa" ? "golsCasa" : "golsFora";
      m[alvo] = (Number(m[alvo]) || 0) + 1;
      if (m.status !== "encerrado") m.status = "encerrado";
      render(); return;
    }

    const tirar = ev.target.closest("[data-adm-tirar]");
    if (tirar){
      const i = Number(tirar.dataset.admTirar);
      const g = (m.gols || [])[i];
      if (g){
        const alvo = g.time === m.casa ? "golsCasa" : "golsFora";
        m[alvo] = Math.max(0, (Number(m[alvo]) || 0) - 1);
        m.gols.splice(i, 1);
      }
      render(); return;
    }

    if (ev.target.closest("#adm-salvar")){ admSalvar(); return; }
  });

  main.addEventListener("change", ev => {
    if (!modoAdmin) return;

    /* "Outro" revela o campo livre sem redesenhar a tela — um render
       aqui apagaria a escolha que a pessoa acabou de fazer */
    const quem = ev.target.closest("[data-adm-sel]");
    if (quem){
      const campo = document.getElementById("adm-nome-" + quem.dataset.admSel);
      if (campo){
        const outro = quem.value === "__outro__";
        campo.hidden = !outro;
        if (outro) campo.focus(); else campo.value = "";
      }
      return;
    }

    const sel = ev.target.closest("[data-adm-time]");
    if (!sel) return;
    const m = jogos().find(x => chaveJogo(x) === admJogo);
    if (!m) return;
    m[sel.dataset.admTime === "casa" ? "casa" : "fora"] = sel.value || null;
    render();
  });
}

/* ============================================================
   FONTE DOS DADOS
   ------------------------------------------------------------
   O app lê as partidas de uma de duas fontes, nesta ordem:

   1. Dentro do Claude (pré-visualização): o banco compartilhado
      do artifact, coleção "partidas".
   2. Fora do Claude (app instalado): o arquivo dados.json que
      vai junto com o app, relido a cada 30 segundos.

   Para ligar uma fonte ao vivo depois (Firebase, planilha
   publicada, API própria), basta preencher FONTE_REMOTA com a
   URL de um JSON no mesmo formato de dados.json.
   ============================================================ */

const FONTE_REMOTA = "";

function lerHash(){
  const novo = location.hash === "#admin";
  if (novo !== modoAdmin){ modoAdmin = novo; admJogo = null; admAviso = null; }
}
window.addEventListener("hashchange", () => {
  lerHash();
  document.getElementById("main").scrollTop = 0;
  render();
});
lerHash();
ligarAdmin();

function aplicar(lista){
  reais = Array.isArray(lista) ? lista : [];
  jaRolou = false;
  render();
}

async function lerArquivo(){
  const url = (FONTE_REMOTA || "dados.json") + "?v=" + Date.now();
  try {
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) return;
    const d = await r.json();
    ELENCOS = d.elencos || {};
    aplicar(d.partidas);
  } catch (e) { /* offline: segue com o que já está na tela */ }
}

render();

(async () => {
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if (db){
    try {
      db.collection("partidas").onSnapshot(
        snap => aplicar(snap.docs.map(d => Object.assign({id:d.id}, d.data()))),
        () => {}
      );
      return;
    } catch (e) {}
  }
  lerArquivo();
  setInterval(() => { if (!document.hidden) lerArquivo(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) lerArquivo(); });
})();
</script>
